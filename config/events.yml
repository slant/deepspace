"47-B":
  title: "The Cost of Inaction"
  body: |
    Sometimes a choice is too large for one person to make. It is often the better choice to make none at all. Your inaction between the humans and Miras leaves you bereft of responsibility, and yet the ongoing struggle between the two makes you wonder if you would have had an impact.
    You wonder even more when the Miras attack the human settlements out of anger. You wonder yet more when the humans retaliate. Wondering is all you have left when war breaks out and the Miras become extinct. Now there's nothing left to wonder about.
