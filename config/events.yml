    The beacon is surrounded by the bodies of another starship crew. From the tattered uniforms you recognize the UEF insignia. They appear as if they had fallen asleep in the open rain. Plants have made their way into the bodies, replacing flesh with vine and root.
    The cargo looks intact. Gain 20 scrap, 2 fuel, and item [Flower Locket]. The map they left behind shows a way back out.
