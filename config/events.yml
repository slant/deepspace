# events.yml — Deep Space D6: The Long Way Home
# Story events from pages 10–74 of the PDF rulebook. Page 75 ("For Demo Purposes") is excluded.
#
# Action types:
#   goto      — navigate to another event (requires metadata.goto: "XX-X")
#   orbit     — return to orbit (end this encounter)
#   complete  — game complete (victory or positive ending)
#   game_over — game over (death or unrecoverable loss)
#
# Conditional choices are prefixed with [Requires: X] in the label.
# Items use [ITEM-NAME] notation. Sequences use their printed codes.
# Some entries are dead ends or unreachable — the author left the adventure incomplete.
# Combat entries note the encounter format (draw deck + starting threats) in the body.
#
# expansion: endless — event is marked with the printed "EE" (Endless Expansion)
# icon in the rulebook (16-A, 17-A). Per rulebook pages 2 & 5: "If you do not have
# the [Endless] expansion, ignore these events." Not yet enforced at runtime — see
# TODO.md "Expansion content flag". Do not confuse with 44-E, which is unmarked and
# always resolves against the page-74 demo card set regardless of expansion
# ownership — see docs/reference/deep-space-d6-mechanics.md.

"10-A":
  title: "Oxygen Leak"
  body: |
    The inhospitable planet Notus where the oxygen farms are being threatened. One day the farms stopped functioning properly. One by one the generators were shutting down and people have had to relocate into shared hubs. It's getting overcrowded. Can you help? We'll pay!
    The farms were built centuries ago and the people have largely forgotten how they function, much less how to fix them. Your chief engineer lays out the following possible plans of action.
  choices:
    - label: "Buy replacement parts → 41-A"
      action: goto
      metadata: { goto: "41-A" }
    - label: "[Requires: SYS-PUMP] Already have the pump → 53-B"
      action: goto
      metadata: { goto: "53-B" }
    - label: "Solve the power problem → 29-A"
      action: goto
      metadata: { goto: "29-A" }
    - label: "Stay and monitor the problem → 30-B"
      action: goto
      metadata: { goto: "30-B" }
  resolvable: true

"10-B":
  title: "A Rain to Drown All Rains"
  body: |
    The rain is endless and there doesn't seem to be a safe place to land. In a clearing far from any light sources, you guide the ship safely down.
    You and your crew make your way through harsh rain and punishing waters until you come across a path.
  choices:
    - label: "Head uphill towards a tall pillar of light → 28-D"
      action: goto
      metadata: { goto: "28-D" }
    - label: "Continue towards the distress beacon signal → 42-A"
      action: goto
      metadata: { goto: "42-A" }
    - label: "It's too dangerous — Return to Orbit"
      action: orbit
  resolvable: true

"10-C":
  title: "A Planet like a Gem"
  body: |
    Even from orbit the planet shines like a star. The radiant light given off from the planet's rings beckons you. According to the StarNav, there is a UEF outpost here. It might be wise to contact someone there. What should we do?
  choices:
    - label: "Seek side jobs → 33-B"
      action: goto
      metadata: { goto: "33-B" }
    - label: "Seek out a UEF contact → 44-A"
      action: goto
      metadata: { goto: "44-A" }
    - label: "Visit the local tavern → 51-A"
      action: goto
      metadata: { goto: "51-A" }
  resolvable: true

"11-A":
  title: "Robots Taking Over"
  body: |
    There are multiple distress beacons coming from this planet. Before you can zero in on one, you're attacked! Threats are swarming your ship and don't appear to respond to any communication. These are robotic ships!
    COMBAT: 2 threats, draw deck of 5.
  choices:
    - label: "Land in a nearby field → 45-B"
      action: goto
      metadata: { goto: "45-B" }
    - label: "Land in the spaceport → 52-B"
      action: goto
      metadata: { goto: "52-B" }
    - label: "Stay in orbit and attempt contact → 51-C"
      action: goto
      metadata: { goto: "51-C" }
  resolvable: true

"11-B":
  title: "Alien Settlers"
  body: |
    Planet designation NMD-11. Many cycles ago humans settled on this abandoned planet. But they were wrong — the planet wasn't abandoned. The Miras used to call the planet home until they left on a species-wide pilgrimage. Now they're back and wish to return to the homes and places they left behind.
    Under guidance of the UEF, the humans made peace with the Miras and the two share most of the planet. However, tensions are rising as the Miras are set to go on another pilgrimage and the humans want to use the vacant resources in their absence. Both species will meet before a council to present their case.
    As members of the UEF, we are required by oath to assist in this matter.
  choices:
    - label: "Hear the human's side → 53-A"
      action: goto
      metadata: { goto: "53-A" }
    - label: "Hear the Mira's side → 42-C"
      action: goto
      metadata: { goto: "42-C" }
  resolvable: true

"11-C":
  title: "Time & Space"
  body: |
    This planet is uncomfortably close to a black hole. Light bends away from the planet making it look like it's in perpetual motion. The distress beacon alternates between strong and faint signals, but a beacon is a beacon and you set down on one of the planet's many islands.
    As soon as you power down your engines, the distress beacon completely disappears. Even after boosting the signal, no distress beacon of any type can be found. "What should we do, Captain?"
  choices:
    - label: "Venture to a nearby island in the direction of the beacon → 35-C"
      action: goto
      metadata: { goto: "35-C" }
    - label: "Leave the planet → 53-C"
      action: goto
      metadata: { goto: "53-C" }
  resolvable: true

"11-D":
  title: "Sea of Thieves"
  body: |
    This planet is covered primarily in water. It reminds you of one of the planets you've read about in the history books. You've heard of this one before. It's legendary. Rumor has it that a famous space pirate hid his treasures somewhere on this planet. If we find it, we'll be home in no time.
    The planet is filled with hunters and explorers seeking the rumored lost treasure. If we work with others, we might find it faster. Or maybe it's just a rumor?
  choices:
    - label: "Search for the treasure on your own → 36-A"
      action: goto
      metadata: { goto: "36-A" }
    - label: "Join a group of hunters → 61-A"
      action: goto
      metadata: { goto: "61-A" }
    - label: "Set a trap for one of the pirates → 31-B"
      action: goto
      metadata: { goto: "31-B" }
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"12-A":
  title: "Manaport Outpost"
  body: |
    Welcome to the Manaport Waystation. No one on Manaport is from Manaport. This station plays host to millions of lifeforms on transient journeys through the stars. Through a symbiosis of interdependence, it exists without a central authority. Its visitors give to the station what it needs, only asking in return a place to rest. This might not be a bad place to spend some time recovering.
  choices:
    - label: "Seek out jobs → 37-A"
      action: goto
      metadata: { goto: "37-A" }
    - label: "Visit the vendor hall → 43-D"
      action: goto
      metadata: { goto: "43-D" }
    - label: "Visit the refueling depot → 72-B"
      action: goto
      metadata: { goto: "72-B" }
    - label: "Visit the research center → 41-B"
      action: goto
      metadata: { goto: "41-B" }
  resolvable: false

"12-B":
  title: "Diaspora"
  body: |
    This was once a rich and prosperous planet until constant warring with the pirate factions resulted in the entire destruction of the planet. What is left looks more like loosely gathered debris.
    Large chunks of the planet are inhabited by various pirate factions and rebels. The nearby United Earths trade location would probably appreciate some policing in the area. Choose a patrol route.
  choices:
    - label: "Patrol route A → 31-C"
      action: goto
      metadata: { goto: "31-C" }
    - label: "Patrol route B → 33-A"
      action: goto
      metadata: { goto: "33-A" }
    - label: "Patrol route C → 45-D"
      action: goto
      metadata: { goto: "45-D" }
  resolvable: true

"12-C":
  title: "A Planet on the Verge"
  body: |
    Strange things keep occurring on this planet. As you get closer you're attacked by a strange new threat you've never seen before.
    COMBAT: see Patrol route A (→ 44-E).
  choices:
    - label: "Engage → 44-E"
      action: goto
      metadata: { goto: "44-E" }
  resolvable: true

"12-D":
  title: "Hephaestus VII"
  body: |
    Neighboring the grand bazaar is a man-made machine planet constructed for the sole purpose of manufacturing a high supply of goods. The planet is surrounded by a thick layer of pollution and acid rain.
    Pirate raids have forced security measures to become uncomfortably strong. As you approach the landing pad, you detect no less than 12 weapons targeting your ship. Whoever put out the distress beacon sure has a funny way of asking for help.
    You hail the manufacturing facility asking for permission to enter. Instead of any warm greeting you are sent a simple text message: "Come in."
  choices:
    - label: "Egress the ship and enter the factory → 49-C"
      action: goto
      metadata: { goto: "49-C" }
    - label: "Turn around and leave → 52-D"
      action: goto
      metadata: { goto: "52-D" }
  resolvable: true

"13-A":
  title: "The Greatest Show"
  body: |
    Lights everywhere, but nothing appears to be for sale. Instead it's all betting and gambling. You stare at the endless venues for countless games, many of which you've never heard of. As your ship docks in a sponsored landing zone, you and your crew are approached by a man in a dazzling outfit. He calls himself the "Game Master" and claims to be the owner of this planet.
    "We don't get many federation ships around here. Please, come with me. You'll be my honored guests for today."
    The men surrounding him with guns pointed at you don't exactly make you feel honored, but you follow him nonetheless. The Game Master suggests that the best way to make money is to join in on the fun. He doesn't give many options.
  choices:
    - label: "Enter the gladiator fights → 21-B"
      action: goto
      metadata: { goto: "21-B" }
    - label: "Try your hand at the card tables → 27-B"
      action: goto
      metadata: { goto: "27-B" }
  resolvable: true

"13-B":
  title: "Just Communication"
  body: |
    The outpost stations here are responsible for relaying information from the pirate zone to the UEF fleets. The distress beacon indicates that the communications lines have been shut down by an unknown force. As you arrive at the primary outpost, an alarm sounds — one of the outposts has come under attack.
    A single shot has completely wiped out one of the smaller outposts. Emergency scanners have failed to locate the source of the attack. You signal a ceasefire as the resident highest ranking official in the zone. Your call is answered by a man calling himself The Shadow.
    The Shadow is a fearsome predator that lives for the glory of battle.
  choices:
    - label: "Engage him → 57-A"
      action: goto
      metadata: { goto: "57-A" }
    - label: "Attempt to flee → 41-D"
      action: goto
      metadata: { goto: "41-D" }
  resolvable: true

"13-C":
  title: "New New Voluptas"
  body: |
    The old Voluptas was a paradise. This newly remodeled vacation planet is a utopia. Things are a little out of budget here.
  choices:
    - label: "Take a break and visit the spa → 55-A"
      action: goto
      metadata: { goto: "55-A" }
  resolvable: true

"14-A":
  title: "Pirate Outpost"
  body: |
    The pirates maintain control of the borders using advanced scouting techniques and positioning large fleets at various outpost locations. Each year they move closer and closer to civilian regions. Here the ships are right at the front door and they need to be stopped. Recent reports say the enemy fleet is one giant warship. This will be a dangerous conflict.
  choices:
    - label: "Advance to the attack → 67-A"
      action: goto
      metadata: { goto: "67-A" }
    - label: "Retreat → Orbit"
      action: orbit
  resolvable: true

"14-B":
  title: "Asteroid Field"
  body: |
    The asteroid field in this sector aids in hiding the pirates. Their ships are designed to withstand impact from the debris. There are dangerous levels of seismic activity and the nearby nebula clouds are throwing off your scanners. Because this is pirate territory, this would be an ideal place for an ambush. Your crew recommends going around or avoiding this area altogether.
  choices:
    - label: "Heed the warnings — Return to Orbit"
      action: orbit
    - label: "Proceed through the asteroid field → 22-A"
      action: goto
      metadata: { goto: "22-A" }
  resolvable: true

"14-C":
  title: "Pirate Queen Headquarters"
  body: |
    Everywhere in the pirate zone the buildings are barely functional and pose a structural threat in themselves. But not here. The central pirate headquarters contain ornate glasswork and gold emblems with avian insignia. It almost looks like a pleasant place to live. You are summoned to see the Queen.
  choices:
