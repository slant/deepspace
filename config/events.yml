"15-A":
  title: "A War on Two Fronts"
  body: |
    It's an all-out war!
    COMBAT: 10 threats, draw deck of 0 (no draw deck — use only the starting threats).
    If you survive, gain 8 scrap. If you are destroyed, lose 2 fuel.
  choices:
