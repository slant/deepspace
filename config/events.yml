    In a butchered transmission you make out the words "Stay Away." In disbelief you notice that the sender of the distress beacon is you — or some version of you that landed on that planet.
    Looking back at the viewport you no longer see a planet. Instead the only thing visible is the black hole. Did the planet get swallowed up? And how did you send and receive your own distress beacon? It looks like we won't have time to find out. Your ship begins to feel the pull of gravity and it's time to go.
