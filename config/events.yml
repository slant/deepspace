  body: |
    As you explore the planet, you see buildings and vehicles — human buildings and vehicles. However, everything looks abandoned rather than conquered by the Endless. The emptiness of the towns leads you to the only place with any activity according to your sensors: a place that looks like a science lab.
    Entering the lab, you immediately recognize the UEF signs throughout the building. One of your officers connects to a nearby terminal and downloads the data-logs. This planet apparently used to be a secret UEF science facility. They had been experimenting with new bio-regenerative technology and testing it on prisoners. According to the log, these experiments failed and the subjects were transformed into the Endless!
    You run back to your ship and notice the distinct silhouette of UEF ships on the way. You don't think they are here to help you.
    COMBAT: The Ouroboros (refer to rulebook for Ouroboros rules).
