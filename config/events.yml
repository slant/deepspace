  body: |
    You begin your long journey home from Sector Alpha. Consume fuel to move to adjacent hexes.
    Beacons (circles) and stores (squares) can be visited once each.
  choices:
    - label: "Return to Orbit"
      action: "orbit"
  resolvable: false

