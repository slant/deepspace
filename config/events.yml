"72-B":
  title: "Refueling Depot"
  body: |
    The queue for the refueling station is long and you decide to wander around the area with your officers. You don't get very far before you're hailed by a distraught woman. She tells you that her son went down into a nearby hatch after he dropped his toy ball down a drainage port. The boy has been missing for about an hour.
  choices:
    - label: "Offer to help look for the boy → 62-B"
