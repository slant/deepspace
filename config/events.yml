    You venture into the heart of the city where the master computer system is located. To fix it you must draw a single continuous circuit (line) through each node (circle), following these rules:
    • The circuit cannot cross itself.
    • The circuit must turn 90 degrees when it hits a black node.
    • The circuit must go straight through white nodes (it cannot turn there).
    • The circuit cannot turn on an X.
    • The circuit must end where it starts.
    (Refer to the rulebook diagram for the node layout. Give yourself at least 30 minutes.)
  choices:
