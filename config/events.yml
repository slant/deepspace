"17-A":
  title: "Resistance"
  expansion: endless
  body: |
    The Endless have consumed all the neighboring planets but pockets of resistance scrape by. Assist them until they are able to evacuate.
    COMBAT: 1 threat, draw deck of 10. When the last threat card is drawn, you win the encounter.
    Gain 3 scrap.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"17-B":
  title: "The Planet Eater"
  body: |
    The distress beacon here is using a special UEF frequency. As you get closer your suspicions are confirmed as you make out the outline of the UEF Manta — heavily damaged with systems in critical condition.
    You teleport aboard and search for survivors. Bodies are littered throughout but none are alive. In one of the jammed escape pods you find an unconscious UEF officer, Officer Carla Muller.
    Muller explains that her crew was responding to a distress beacon in Endless territory when a giant spaceship made from millions of smaller ships swarmed the UEF Manta and tore it apart. Parts of the Manta were assimilated and the monstrous ship grew in size and speed. Based on recorded data, the doomsday ship is headed towards the Grand Bazaar. If it gets there, the mass it consumes will make it unstoppable.
  choices:
    - label: "Chase down the planet eating ship → 40-C"
      action: goto
      metadata: { goto: "40-C" }
    - label: "Rely on the bazaar's defenses and leave → 53-D"
      action: goto
      metadata: { goto: "53-D" }
  resolvable: true

"17-C":
  title: "Relic of the Past"
  body: |
    A massive structure can be seen from light-years away. It looks like a ring made from stone. It doesn't seem to function anymore.
  choices:
    - label: "[Requires: Sequence 521] → 26-C"
      action: goto
      metadata: { goto: "26-C" }
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"17-D":
  title: "???"
  body: |
    No such planet is listed on any official star map. The planet is clearly there and your scanners can verify it. It could be a trap. Something beckons you.
  choices:
    - label: "Land on the planet to explore it → 25-A"
      action: goto
      metadata: { goto: "25-A" }
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"18-A":
  title: "Aergia Moon Colony"
  body: |
    The UEF-sanctioned Aergia was a peaceful planet until the uprising of a radical colony group calling themselves The Red Asters. The Red Asters claim that the UEF is improperly taxing the Aergia Colony without proper representation. The distress beacon originates from the Magnolia Foundation, one of the original settling dynasties.
    You set down the ship and are immediately greeted by a lone woman — April Cassus. She explains that Aergia is on the verge of complete mutiny. The Red Asters are seeking something called the Pandora Box which is hidden in the Magnolia Foundation compound. April admits she does not know the contents of the locked box, only that her forefathers placed it there for safe keeping. The last person who knew the contents was her older brother who never returned from an exploration mission in the Alpha Sector.
    April asks for your help defending the compound.
  choices:
    - label: "Assist April with defending the compound → 58-C"
      action: goto
      metadata: { goto: "58-C" }
    - label: "Demand to open the box → 27-C"
      action: goto
      metadata: { goto: "27-C" }
    - label: "[Requires: Flower Locket] → 50-C"
      action: goto
      metadata: { goto: "50-C" }
  resolvable: true

"18-B":
  title: "Split"
  body: |
    The space between the UEF zone and the pirate territory is an ongoing war. You've been assigned to aid the UEF forces on the ground as part of the 7th Fleet.
    While orbiting the planet, you run into a pirate scouting team. You fire your lasers and bring their ship to destruction. In the aftermath, the pirate escape pod activates a distress beacon broadcasting to all channels — highly unusual, as pirates use their own channel.
    You show mercy and rescue the escape pod. Safety scans show two life forms and no weapons. When the pod doors open you're floored to see two young children emerge. It turns out they are brother and sister. Their mom is a citizen of the pirate colonies; their dad is a soldier from the UEF. They both want to go home, but in separate ways.
  choices:
    - label: "Send the boy to his father in the UEF, then Return to Orbit"
      action: orbit
    - label: "Send the girl to her mother in the pirate colony, then Return to Orbit"
      action: orbit
    - label: "Send both children to the UEF, then Return to Orbit"
      action: orbit
    - label: "Send both children to the pirate colony, then Return to Orbit"
      action: orbit
  resolvable: true

"19-A":
  title: "Home"
  body: |
    You finally made it home.

    It is true that when you first joined the UEF you were searching for your place in the universe. How fitting then that to find your place you had to become truly lost. The journey of a hero may culminate in celebration, applause, and revere; but a real ending is undramatic. To have seen the things you've seen and to recall the choices you've made is to consider not what difficulties or challenges had beset you. Rather, to understand the urge to serve others at whatever the cost.
    The UEF has made you into a symbol. You are a beacon of what the UEF stands for, bred not from battlefields and sorties, but from difficult choices made with the trust earned by your crew.

    "Safety does not exist in outer space. Avoiding danger is no safer in the long run than meeting it head-on. Life is either a daring adventure, or nothing at all."

    — Check your sequences and items below for additional endings before choosing Journey Complete.
  choices:
    - label: "[Circled sequence 000] → 38-B"
      action: goto
      metadata: { goto: "38-B" }
    - label: "[Underlined sequence 99] → 24-A"
      action: goto
