"29-A":
  title: "The Power Problem"
  body: |
    It looks like the power system is complex but one of the panels contains some instructions. You see if you can decipher it.
    The grid has nodes P, B, C, X, T, R, Y, Z, E connected to Colonies 1, 2, 3 and Batteries, with a Filter at 73%.
    Rules:
    1. If the Filter is above 60%, Colony 3 must have 3 connections.
    2. P must be connected to T, but cannot be connected to B.
    3. All colonies must be connected to 3 batteries unless it connects to a filter.
    4. Y can only have 2 connections.
    5. If X only has 2 connections, rule 2 no longer has to be valid.
    6. If the Filter is below 80%, Colony 2 can only have 1 connection unless rule 8 is valid.
    7. X and C must have the same number of connections.
    8. Y must connect to Z.
    9. If R is connected to E, Colony 2 can only have 1 connection.
    (Refer to the rulebook diagram for the grid layout.)
  choices:
