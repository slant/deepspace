"20-C":
  title: "Traveling Traders"
  body: |
    You're able to find the traveling traders by following their social media! Choose to perform any number of the following actions.
    • Research: spend 3 scrap per roll on available crew dice.
    • Purchase 1 fuel for every 5 scrap (limit 5).
    • Complete Luxury Food mission: lose [Lux Food], gain 15 scrap.
  choices:
