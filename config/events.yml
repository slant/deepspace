"21-A":
  title: "Adrift"
  body: |
    Your ship is out of fuel. As you drift you think of all the things that could have gone differently. Maybe someone will find you? Maybe you can play a game to pass the time?

    Boredom and idleness is exactly when we feel time and being the most acutely. Alone together in our lighted ship, sailing against the darkness and all that was yet to come.

    THE END
  choices:
    - label: "Game Over"
      action: game_over
  resolvable: true

"21-B":
  title: "Gladiator Fights"
  body: |
    You are confident in the abilities of your officers. The gladiator fights have the largest payout. Pick one of your officers. Cross out their title and replace it with GLADIATOR. If the officer fails any challenge, cross out the entire officer and lose any scrap gained from this event.
    Using all 6 crew dice, pick one of the following challenges (crew symbols are any face except the skull):
    • Roll 3 matching crew symbols in 3 rolls — gain 3 scrap.
    • Roll 5 matching symbols in less than 6 rolls — gain 5 scrap.
    • Roll 1 of each symbol in less than 10 rolls (duplicates must be re-rolled) — gain 25 scrap.
    • Roll no skulls in a single roll — gain 15 scrap.
    • Roll 3 matching crew symbols in 1 roll — gain 10 scrap.
    • Roll 2 pairs of any symbol in 2 rolls — gain 5 scrap.
    If successful, you may pick a different challenge or return to Orbit.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"22-A":
  title: "Asteroid Field"
  body: |
    The asteroids appear to push off each other with tremendous force. Roll the threat die:
    1 — The asteroids graze your ship but cause no significant damage.
    2 — An asteroid hits your cargo bay area. Lose 5 scrap.
    3 — An asteroid hits your fuel tanks. Lose 2 fuel.
    4 — An asteroid hits your fuel tanks. Lose 2 fuel.
    5 — Several asteroids make impact. Lose 5 scrap and 1 fuel.
    6 — Small asteroids crumble into valuable ore. Gain 5 scrap.
    In all the mayhem, your scanners detect a nearby hidden cache.
  choices:
    - label: "Stay in the asteroid field, roll again, and grab the cache → 23-A"
      action: goto
      metadata: { goto: "23-A" }
    - label: "Get out of the asteroid field — Return to Orbit"
      action: orbit
  resolvable: true

"23-A":
  title: "The Cache"
  body: |
    You came all this way — you might as well try to get something out of it. You pull the cache into your holdings and proceed to unlock it. A cloud of smoke fills your immediate surroundings. In that moment your alarms go off. It was a trap!
    COMBAT: 3 threats, draw deck of 4. You cannot return crew from the scanners using any station action.
    Gain 2 scrap.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"23-B":
  title: "A Harmonious Arrangement"
  body: |
    It was always strange to you how those in charge of people often lived better lives than those they were in charge of. If their responsibility is the well-being of their followers, why then do the followers live so poorly? You suggested that the humans who lived with the Miras redistribute the current wealth. This task was difficult for the humans, but with assistance from the Miras who live communally, they were able to achieve a harmonious arrangement.
    Humans and Miras continue to coexist and share in each other's culture and technology. When you return to the planet many decades later you're surprised to find something of a utopia. It makes you wonder how cultural diversity can improve the lives of beings on other planets.
    (Sequence ending — return to 19-A for remaining sequences.)
  choices:
    - label: "Return to 19-A"
      action: goto
      metadata: { goto: "19-A" }
  resolvable: true

"24-A":
  title: "The Reunion"
  body: |
    After you've taken a ride on an archaic "tractor" type vehicle, you come up to a structure that looks like a farm. The invitation said RED BARN and this is the only building for miles. You walk in and are surprised to see some of your old crew. It's a reunion!
    The faces appear aged but each one immensely familiar. The one responsible for this shindig approaches you. You recall how this person was adamant about saving the AI programming of some machine you destroyed back when you were far from home.
    The AI has advanced beyond current technology. As you watch ducks being fed by robotic workers you can't help but appreciate the peaceful tranquility of the moment.
    (Sequence ending — return to 19-A for remaining sequences.)
  choices:
