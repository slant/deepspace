"42-C":
  title: "The Mira Side"
  body: |
    The Miras appear to be a very peaceful species, though they are very territorial. A Mira representative speaks:
    "We have seen what humans do to the lands they use. They damage it beyond repair and care not for any generations that may inherit it afterwards. We Mira experience time much differently to you humans. What is a 50-year pilgrimage to you is merely a few days to us. Humans appear incapable of planning beyond 100 or so years — a number that aligns with your average lifespan. All we ask is that the land we use remain untouched by human hand while we are gone. We have lived in unison with this planet for millions of years. Human presence here has been unplanned but we have made compromises. When we leave, nothing will change for the humans."
    As an outsider human, your words will have a large impact at the council. One of your crew members points out that the Miras have no way to enforce their desires if they weren't to happen.
