    Though this marks your end with the UEF, you've widened your eyes to the greater adventures and possibilities of the galaxy. Perhaps one day you'll set off on another adventure. They all witnessed first-hand the destructive power of the Endless and knew you made the right call. Sometimes the highest authority in the universe is your own conscience.
