"54-D":
  title: "The Empty Room"
  body: |
    On your way out you pass by the room where the teenagers were gathered. To your surprise the room is completely empty with no sign that they were ever there. As you canvas the area for clues, the faint sound of video blips and bloops is barely audible.
    Once outside you attempt to get in touch with the woman you first asked for your assistance. Your comm-link can find no such number, only suggesting that the number has been disconnected for many years.
  choices:
    - label: "Head back to get refueled → 73-A"
      action: goto
      metadata: { goto: "73-A" }
  resolvable: true

"55-A":
  title: "The Spa"
  body: |
    You and your crew spend the whole day at the spa. It's quite relaxing, but you can't help but wonder if there was something more to it. The downtime gives you the chance to appreciate the beauty of life.
    Lose 10 scrap.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

# 56-A appears to be a duplicate of 48-A in the PDF text — likely an authoring error.
"56-A":
  title: "Treasure Site B"
  body: |
    The AI to the system is complex but you contain it after outsmarting it.
    NOTE: This entry appears to duplicate 48-A in the rulebook. Likely an authoring error — treat as the same outcome.
    [Requires: GREEDY or ROBOTICIST] — underline sequence 99. Gain 15 scrap.
  choices:
    - label: "Destroy the AI — gain 15 scrap, Return to Orbit"
      action: orbit
      metadata: { scrap_delta: 15 }
    - label: "Keep the AI — gain 15 scrap, acquire item [AI-System], Return to Orbit"
      action: orbit
      metadata: { scrap_delta: 15 }
  resolvable: true

"56-B":
  title: "Group B Treasure Hunt"
  body: |
    You rendezvous at the designated waypoint, certain that the treasure is located here. As you approach the canyon, you make out a faint glimpse of pirate ships surrounding you. It's a trap! Fight your way out.
    COMBAT: 4 threats, draw deck of 4.
    The dust settles and the treasure is all yours! Gain 8 scrap.
    "Alas, we can retire from this lucrative life of hunting and danger," jokes a crew member.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"56-C":
  title: "Ladder Pulled Up"
  body: |
    It worked! You turn around to celebrate the success only to find that the famous treasure seekers have raised the ladder out of the canyon, trapping you below!
    "Sorry, but you don't become famous by sharing loot! Better luck next time."
    It takes a few hours before the crew back at your ship realizes you're missing and sends help. They get you out of the canyon but the traitors are long gone.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"57-A":
  title: "The Shadow"
  body: |
    The Shadow is a ruthless pirate hunter who only lives for the challenge of a good fight. He challenges you to a 1-on-1 ship duel. If he wins, you and your crew will perish. If you win, he will let you go and leave the outpost. You have no choice but to accept.
    Your scanners indicate that The Shadow's vessel is capable of cloaking and has a long range cannon.
    Setup: Use your ship token for your ship (starts at position A) and another token for The Shadow's ship (starts at position B). Refer to the rulebook for the asteroid field map and movement compass.
    Each turn:
    1. Move your ship one space in any direction (not optional). Neither ship can move into an asteroid.
    2. Place a crew die showing the command icon in any open space.
    3. Roll the threat die and move The Shadow based on the result. If The Shadow lands on your crew die marker, it takes a hit — cross out one direction on its movement compass.
    4. If The Shadow can draw a straight line in any hexagonal direction to your ship (ignoring obstacles), it lands a hit — surrender a crew die.
    If you have surrendered 5 crew dice, you lose the battle. If The Shadow has taken 6 hits, you win.
  choices:
    - label: "Victory — The Shadow is defeated → 58-A"
      action: goto
      metadata: { goto: "58-A" }
    - label: "Defeat — you surrendered 5 crew dice"
      action: game_over
  resolvable: true

"58-A":
  title: "The Shadow Defeated"
  body: |
    The Shadow's ship is crushed and you are the victor. He begs you to destroy his ship, as he can no longer return home defeated.
  choices:
    - label: "Show mercy and spare him → 60-C"
      action: goto
      metadata: { goto: "60-C" }
    - label: "Destroy his ship — gain 5 scrap, Return to Orbit"
      action: orbit
      metadata: { scrap_delta: 5 }
  resolvable: true

"58-B":
  title: "Red Asters Refuse"
  body: |
    The Red Asters refuse to communicate with you. You have no choice but to help April, as she is at risk. April says her family has a powerful weapon — a red medallion that increases the efficiency of your crew.
  choices:
    - label: "Continue → 58-C"
      action: goto
      metadata: { goto: "58-C" }
  resolvable: true

"58-C":
  title: "Defend the Compound"
  body: |
    April is overjoyed by your answer to the call of duty. The Red Asters command a powerful fleet, but April gives you a weapon that will help you turn the tide.
    COMBAT: 5 threats, draw deck of 9.
    Special bonus station for this encounter only: convert all available crew to medical crew.
  choices:
    - label: "Victory → 59-C"
      action: goto
      metadata: { goto: "59-C" }
  resolvable: true

"59-A":
  title: "Leaving Manaport"
  body: |
    Manaport never sleeps, but you do. You decide it's time to leave.
  choices:
    - label: "[Requires: Lux Food AND Fluffy Creature] → 61-D"
      action: goto
      metadata: { goto: "61-D" }
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"59-B":
  title: "Hunting the Android"
  body: |
    The last known sighting of the android was near the hovercar assembly line. You and your officers spread out following your movement detectors. With all the machinery, it's hard to tell what's a machine and what could be the android.
    Then you spot it. The humanoid robot is unmistakable. You draw your blaster pistol and follow the android behind an oil tank. Right as you round the corner, it flips a switch dropping several large car chassis around you, cutting you off from your officers. The android stares at you with red eyes glowing and a large wrench in its hands. One of your officers is shouting at you to shoot it.
  choices:
    - label: "Fire at the android → 61-E"
      action: goto
      metadata: { goto: "61-E" }
    - label: "Put your hands up → 65-B"
      action: goto
      metadata: { goto: "65-B" }
  resolvable: true

"59-C":
  title: "Mutiny Averted"
  body: |
    The Red Asters are quelled. A moon colony mutiny has been averted. You will no doubt be promoted once word of your accomplishments has reached home.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"60-A":
  title: "Q-Bomb Detonates"
  body: |
    Q-Bomb detonates, but as the ensuing explosions bear out across your ship, the heat and force become gas before making contact with anything. In what seems like a final act of kindness, the creatures you helped have helped you in return. Cross out [Q-Bomb].
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"60-B":
  title: "The End of the Ship"
  body: |
    Your ship is pulled apart by an army of tiny machines. The machines methodically disassemble your whole ship before your very eyes. The machines are savage until they reach you and your crew — they avoid you for as long as possible but eventually make contact and self-destruct. The planet killer is falling apart! This might be the end for your crew, but at least the millions at the bazaar will be safe.

    THE END
  choices:
    - label: "Game Over"
      action: game_over
  resolvable: true

"60-C":
  title: "Mercy for The Shadow"
  body: |
    You leave The Shadow to the emptiness of space. Before the comms are disconnected he says that he will see you again and that it will be the last time.
    You may now research the Cloaking Device in the Research & Development section of your character sheet. Cross out the '?' box.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"61-A":
  title: "Join a Group"
  body: |
    People have been searching for this treasure for ages. By joining a group we can catch up on their progress. There are two groups willing to join forces. You tell them you just need enough to help you get home.
  choices:
    - label: "Join Group A — famous seekers offering 75/25 split → 62-A"
      action: goto
      metadata: { goto: "62-A" }
    - label: "Join Group B — small group offering 50/50 split → 56-B"
      action: goto
      metadata: { goto: "56-B" }
  resolvable: true

"61-B":
  title: "Rising Waters"
  body: |
    The water levels feel like they're rising. For each officer on your crew, roll 2 crew dice. Any officer with a result containing at least one skull — place an X in their box.
    You press onward until you come upon a split in the path.
  choices:
    - label: "Take the path on the left → 39-B"
      action: goto
      metadata: { goto: "39-B" }
    - label: "Take the path on the right → 70-A"
      action: goto
      metadata: { goto: "70-A" }
  resolvable: true

"61-C":
  title: "Treasure Site C — It's a Trap"
  body: |
    It's a trap! You begin to doubt whether there was any actual treasure this whole time.
    COMBAT: 3 threats, draw deck of 3.
    We've wasted enough time on this planet.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"61-D":
  title: "Feeding the Creatures"
  body: |
    The ship's galley chef informs you that the creatures' current intake of food stands to exhaust the current supply of rations. She suggests giving the creatures some of the Luxury Food to hold them over. Your officer suggests rounding them up and sending them out the airlock. What should we do?
  choices:
    - label: "Round up and jettison the creatures in a pod back to Manaport → 62-C"
      action: goto
      metadata: { goto: "62-C" }
    - label: "Allow the creatures to snack on some of the Luxury Food → 71-A"
      action: goto
      metadata: { goto: "71-A" }
  resolvable: true

"61-E":
  title: "The Android Surrenders"
  body: |
    The shot rips through the android's shoulder faster than it can react. You are surprised to discover that the android begins to make noise as if reeling from the pain of the blaster shot. The android surrenders.
  choices:
    - label: "Keep the android and report it was destroyed → 66-A"
      action: goto
      metadata: { goto: "66-A" }
    - label: "Hand the robot over to the representatives → 73-B"
      action: goto
      metadata: { goto: "73-B" }
  resolvable: true

"62-A":
  title: "The Dice Tower"
  body: |
    You only need enough to get home, and the famous group seems to be the most capable. The treasure seekers tell you about a hidden cavern filled with traps. You'll need to work with them to unlock the traps and reveal the passage to the treasure. They take a position in an adjacent cave and wait for you to complete your side of the puzzle.
    Take 5 crew dice and turn them so that the command icon is face up. Then without looking, stack the 5 dice in a single tower. By only touching two dice at a time, rotate each die until the pattern matches the target image in the rulebook (the orientation of the icon does not matter).
    If the dice fall over, the trap is sprung.
  choices:
    - label: "Dice fell over — trap sprung → 54-C"
      action: goto
      metadata: { goto: "54-C" }
    - label: "Succeeded — trap disarmed → 56-C"
      action: goto
      metadata: { goto: "56-C" }
  resolvable: true

"62-B":
  title: "Looking for the Boy"
  body: |
    The woman leads you to the location of the hatch. It's not far from the station and there are lots of children playing in the area. You tell her to wait for her son at home while you attempt a search. She leaves you with her comm number and you climb down the hatch.
    Graffiti lines the walls and arrows have been painted on corners suggesting a path. To your surprise there are lights every few feet. You follow the sound of some noise and come across a group of teenagers playing video games in the dark. They don't seem concerned about your presence. When asked about a young boy, they offer nothing insightful.
  choices:
    - label: "Continue looking → 63-A"
      action: goto
      metadata: { goto: "63-A" }
    - label: "Leave and go back to the fuel station → 73-A"
      action: goto
      metadata: { goto: "73-A" }
  resolvable: true

"62-C":
  title: "Jettison the Creatures"
  body: |
    It takes some time but your crew is able to find all the fluffy creatures and lock them into a container. Lose 1 fuel. The last of the creatures stare at you with wide, sad eyes. Perhaps they'll find a new home back on Manaport.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"62-D":
  title: "Counterattack"
  body: |
    You're running out of cover and decide to counterattack. You order your crew to fire back at the alien ship. The initial barrage of laser fire appears to have no effect on its thick armor. Switching to missiles, the alien ship accurately disintegrates each missile mid-flight before it can make contact.
    The next sound you hear is one you never thought you'd hear. The radio sounds of your ship and its crew being destroyed sends chills down your spine. It only takes a few minutes before you can hear the alien ship bearing in on your location. It seems your destiny will end here.

    THE END
  choices:
    - label: "Game Over"
      action: game_over
  resolvable: true

"63-A":
  title: "Deeper in the Mines"
  body: |
    Further down the corridors you catch a glimpse of a short figure. Calling out, they stop to look back before running down an adjacent hallway. In a hurry you and your officers give chase. From the corner of your eyes you look into rooms and notice a large amount of discarded mining equipment. As you pass each room, the amount of equipment increases substantially.
    You stop to catch your breath when one of your officers speaks up. They recall details of a massive mining colony that drilled into a subterranean gas pocket and the releasing toxins killed hundreds of miners. The story continues that the gas caused hallucinations of children running around in the mines, resulting in many workers refusing to evacuate.
  choices:
    - label: "Continue looking → 64-A"
      action: goto
      metadata: { goto: "64-A" }
    - label: "Leave and go back to the fuel station → 54-D"
      action: goto
      metadata: { goto: "54-D" }
  resolvable: true

"63-B":
  title: "The Queen's Deal"
  body: |
    The Queen welcomes you to her stronghold. Despite her reputation, she doesn't appear threatening or hostile. Hearing about your accomplishments throughout the sector, she offers you a deal.
    The queen tells you about a nearby planetoid that holds immense wealth but is guarded by dangerous creatures. She has lost many ships trying to acquire it. She asks that you recover the treasure at 15-B and bring it back to her. Draw a beacon at 15-B.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"63-C":
  title: "Ouroboros Defeated"
  body: |
    The Ouroboros lies in wreckage. In their last breath, the crew of the Ouroboros claims to be rogue agents and that the UEF will deny any involvement.
    Acquire [DATALOG-9].
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"64-A":
  title: "The Boy in the Mines"
  body: |
    Further down the mines you can hear the laughter of children. From behind you, a young boy appears holding a small ball. He asks if you would like to play catch, but before you can answer he runs off into the darkness.
    There is no more equipment now and, save for a few torches, the walls are barren. Looking down you see footprints. On closer inspection they match the UEF standard issue boot.
    [Requires: COWARD] — you must select the leave option.
  choices:
    - label: "Follow after the boy → 65-A"
      action: goto
      metadata: { goto: "65-A" }
    - label: "Leave and go back to the fuel station → 54-D"
      action: goto
      metadata: { goto: "54-D" }
  resolvable: true

"64-B":
  title: "Assault on the Queen"
  body: |
    With the Queen and her men distracted you set your plan into action. All at once, you and your officers open fire on the Queen and her guards. In the ensuing chaos one of your officers is fatally wounded. Your ship sets off an ion bomb, disabling the pirate defenses and jammers, and you teleport back to your ship. With the pirate headquarters in disarray you make a clean escape.
    [Unless you have DARK MATTER SPECIALIST, ASSASSIN, or LOYAL] — lose item [Vortex].
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"64-C":
  title: "Deep Space D-6"
  body: |
    You return the mysterious cargo to the proper UEF authorities. It's a bunch of old toys — something called "Deep Space D-6." The officer tells you they were small board games made by the UEF to get kids interested in space travel. Apparently it was a very effective tool! Each game sells at a vintage auction for ridiculous amounts of money.
    Good thing you kept a copy for yourself.
    (Item ending — return to 19-A for remaining sequences.)
  choices:
    - label: "Return to 19-A"
      action: goto
      metadata: { goto: "19-A" }
  resolvable: true

"65-A":
  title: "The Laughter"
  body: |
    The laughter is so loud now and it sounds like there are even more children. Are they trapped down here? Were they playing some sort of game?
    Your eyelids feel heavy and right as you are about to tell your crew to take a short break, you notice they've already begun to nap. You might as well sleep now. Right on the floor. Right next to these footprints. Footprints of your own shoes.
    You'll find the boy in the morning.

    THE END
  choices:
    - label: "Game Over"
      action: game_over
  resolvable: true

"65-B":
  title: "The Android's Message"
  body: |
    The android has not attacked you despite having a clear opportunity. You raise your arms to signal that you mean it no harm. As you slowly approach, it extends its arm offering the wrench.
    You look closer at the tool and find a rough engraving on the side. The words are clear: "NO DELETE I."
    Back at your ship, your officers run a memory diagnostic and discover that the android was created by the machines as a way to communicate with the manufacturing companies. It explains that it was built to feel pain in order to convey the dangerous work environment of the facilities. The android reports numerous work-related casualties that were erased from record. It further reports that it was acting out of self-defense when it attacked the workers who attempted to dismantle it.
  choices:
    - label: "Keep the android and report it was destroyed → 66-A"
      action: goto
      metadata: { goto: "66-A" }
    - label: "Hand the robot over to the representatives → 73-B"
      action: goto
      metadata: { goto: "73-B" }
    - label: "Explain the situation to the representatives → 54-D"
      action: goto
      metadata: { goto: "54-D" }
  resolvable: true

"66-A":
  title: "Keep the Android"
  body: |
    You decide to hold on to the android yourself. This kind of advanced technology belongs with the UEF. Gain item [ANDY]. The representatives are concerned that they were not able to salvage any parts, but are happy that the android has been taken care of. Gain 5 scrap.
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"66-B":
  title: "The Canyon Walls"
  body: |
    The alien ship's weapons are too powerful to contend with. You run back to the safety of the canyon walls. As you observe the alien ship you notice that the lasers it fired left no trace of destruction.
    You throw your radio out into the open and in a flash it too disappears after being struck by a laser beam. That's when you notice that your officer's radio is still picking up a signal. The alien ship isn't destroying things — it's abducting them!
    You gather your officers and as a group run out into the opening. As predicted, a beam of hot light comes down and in the next moment you are inside the ship.
    The walls match the same texture and pattern of the canyons you were once in. You travel down familiar pathways — everything looks the same except there are no chains.
    It makes perfect sense now. The mountain is not a mountain — it is an ancient cosmic creature with the ability to produce energy from nothing. The creature must have been imprisoned here and forced to create goods and valuables. The alien ship you are currently aboard is its mate, trying to protect it. As you make your way to the center of the ship you come upon an identical vortex to one you saw previously. Your officer says this vortex is much weaker and you may be able to teleport it back to your ship.
  choices:
    - label: "Teleport back to your ship and free the chained creature → 50-A"
      action: goto
      metadata: { goto: "50-A" }
    - label: "Teleport the vortex back to your ship and escape with it → 73-C"
      action: goto
      metadata: { goto: "73-C" }
  resolvable: true

"67-A":
  title: "The Dreadship"
  body: |
    The Dreadship comes into range and the battle begins. Combat the ship following the regular Deep Space D-6 rules. Instead of placing scanner dice on your ship board, place them on the Dreadship in the appropriate spot. Medical crew can still interact with this space as if it were the scanners.
    When attacking the ship, you may target any of its systems individually. Mark off a box for each damage. When all boxes for a system are filled, cross out that system — it can no longer be activated. To destroy the ship, mark off all boxes for the ship's core.
    Dreadship systems (refer to rulebook diagram):
    • Hull systems — deal -3 Hull and -2 Hull damage.
    • Infirmary system — sends a unit to the infirmary.
    • Core system — must destroy all other systems first; immune for one round after its shield activates.
    Once the ship is defeated, gain 10 scrap.
  choices:
    - label: "Victory — gain 10 scrap, Return to Orbit"
      action: orbit
      metadata: { scrap_delta: 10 }
  resolvable: true

"68-A":
  title: "The Pandora Box Opened"
  body: |
    You open the box and reveal a piece of paper. Paper is an old inscribing technology used by ancient civilizations to document events. The paper is clearly of UEF origins but uses the old UEF insignia.
    The document outlines the UEF constitutional policy on colony rights. It states: "Any new space-born human race shall maintain priority involvement on all matters pertaining to inter-space government."
    This document would completely change the power holders of the current UEF government structure.
  choices:
    - label: "Give the document to the Red Asters → 59-C"
      action: goto
      metadata: { goto: "59-C" }
    - label: "Secure the box for transportation to the UEF HQ → 69-A"
      action: goto
      metadata: { goto: "69-A" }
  resolvable: true

"68-B":
  title: "Invictus"
  body: |
    You followed orders and brought the UEF a sample of the Endless. As a reward, you're promoted to Admiral and given command of your own station at Alexandria, a small outer reach planet. The technology from the Endless creates a surplus of resources for your planet. But the technology is finite.
    Your former commanders at the UEF request that you bring the Endless tech home to Terra where it can be further researched and possibly replicated. You fear the tech will be destroyed and put Alexandria — your new home — in peril. Without your compliance the UEF is forced to reject Alexandria's membership. That's okay, because you don't need their help anymore. We'll have a new name, one that better represents us.
    We are now Invictus.
    Many colonies across the galaxy join Invictus. The old ways of the UEF are being demolished. The UEF puts up a good fight, almost defeating you — but that's when your engineers present you with something far greater than any single weapon in the UEF. The Ouroboros Mark III. There's not a single ship in the galaxy that can stop it.

    THE END
    (Item ending — reached from 19-A for item EE7.)
  choices:
    - label: "End"
      action: complete
  resolvable: true

"69-A":
  title: "Seize the Box"
  body: |
    The Red Asters are in no position to bargain. You seize control of the box. Gain item [PandoraBox]. As captain of the UEF, the stability of the United Earths Federation is your primary objective.
    With the box in your possession, The Red Asters make a counterattack on your ship.
    COMBAT: 4 threats, draw deck of 4.
    If defeated, lose item [PandoraBox].
  choices:
    - label: "Defeated — lose [PandoraBox], Return to Orbit"
      action: orbit
    - label: "Victorious — Return to Orbit"
      action: orbit
  resolvable: true

"70-A":
  title: "Rising Waters"
  body: |
    The water levels feel like they're rising. For each officer on your crew, roll 2 crew dice. Any officer with a result containing at least one skull — place an X in their box.
    You press onward until you come upon a split in the path.
  choices:
    - label: "Take the path on the left → 39-B"
      action: goto
      metadata: { goto: "39-B" }
    - label: "Take the path on the right → 72-A"
      action: goto
      metadata: { goto: "72-A" }
    - label: "Turn back — Return to Orbit"
      action: orbit
  resolvable: true

"71-A":
  title: "Snack Time"
  body: |
    There's plenty of Luxury Food to feed the creatures and still make the delivery. Luckily the creatures only seem to want a little bit of the high-end food. It doesn't take long before many of the little creatures start to look sick and appear to go into a coma.
    You have your doctor run tests and discover that the Luxury Food was laced with a poison that was undetectable. Because of the creatures' fast metabolism, the poison was able to be identified. This food would have surely killed any humans that consumed it! You file a report calling for the arrest of the man who gave you the cargo, though you suspect the original owner of the goods is long out of the picture. Cross out [Lux Food].
  choices:
    - label: "Return to Orbit"
      action: orbit
  resolvable: true

"71-B":
  title: "The Pod Enters the Maw"
  body: |
    The escape pod enters the maw of the ship and your sensors detect that the size of the ship has decreased ever so slightly. You surmise that the ship cannot handle complex organic matter.
  choices:
    - label: "Pilot your ship into the maw → 60-B"
      action: goto
      metadata: { goto: "60-B" }
    - label: "Slingshot the UEF Manta into the maw → 72-C"
      action: goto
      metadata: { goto: "72-C" }
  resolvable: true

