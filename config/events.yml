"15-B":
  title: "The Queen's Gambit"
  body: |
    As your ship flies in closer to the planet you see the destroyed remains of countless other ships. How many other ships were sent here by the Queen? Is it a mission or a death sentence?
    This region of the planet is filled with endless snowfall. The map given to you by the pirate queen indicates that you'll need to travel on foot for the rest of the way. You embark into the perilous wilderness.
    As you pass by the remains of the other ships, you don't seem to find any bodies and the escape pods are mostly intact. The map leads you to a tall mountain with a hole at the top similar to a volcano. You venture further in, led on by the blinking dot of the nav map.
  choices:
    - label: "Continue → 41-C"
      action: goto
      metadata: { goto: "41-C" }
  resolvable: true

"16-A":
  title: "Heart of the Swarm"
  expansion: endless
  body: |
    This is where the Endless Ships seem to be originating from. There's no time to report them to the UEF — we must stop them now. You hope you and your crew are ready.
    COMBAT: 2 threats, draw deck of 15.
  choices:
    - label: "Defeated the Endless Threat → 40-B"
      action: goto
      metadata: { goto: "40-B" }
    - label: "Defeated by the Endless Threat → 26-B"
